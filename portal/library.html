<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Library / Locked In Dept.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/portal/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/portal/config.js"></script>
<script src="/portal/data.js"></script>
</head>
<body data-page="library">
<div id="chrome"></div>
<main class="page">
<section class="head gut">
<div><p class="lbl" style="margin-bottom:12px" id="count">The method, in order</p><h1 class="big">Library</h1></div>
<div style="flex:0 1 360px;min-width:0"><label for="search" class="lbl" style="display:block;margin-bottom:4px">Search</label><input id="search" class="input" type="search" placeholder="Pricing, proposals, content..." style="font-size:18px;height:48px"></div>
</section>
<div class="gut" role="group" aria-label="Filter by stage" style="padding-block:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;border-bottom:1px solid var(--line)"><span class="lbl" style="margin-right:8px">Filter</span><span id="filters" style="display:flex;flex-wrap:wrap;gap:8px"></span></div>
<div class="grid" id="grid"></div>
<script>
document.addEventListener("lid:ready", function () {
  var D = LID.data, done = LID.state.done || {}, f = "all", q = "";
  var next = LID.nextLesson();
  function render() {
    var ls = D.lessons.filter(function (l) { return (f === "all" || l.module === f) && (!q || (l.title + " " + l.summary).toLowerCase().indexOf(q) >= 0); });
    document.getElementById("grid").innerHTML = ls.map(function (l) {
      var m = D.method.find(function (x) { return x.key === l.module; });
      var st = done[l.n] ? '<span class="lbl" style="color:var(--mute)">Watched</span>' : (next && next.n === l.n ? '<span class="badge">Up next</span>' : (l.video ? '' : '<span class="badge soft">Soon</span>'));
      return '<a class="card" href="/portal/lesson?n=' + l.n + '"><span class="meta lbl"><span>' + (m ? m.title : '') + ' / ' + l.mins + ' min</span>' + st + '</span><p class="ghost">' + l.n + '</p><p class="title">' + l.title + '</p></a>';
    }).join("") || '<p class="gut" style="padding-block:40px">Nothing matches.</p>';
    document.getElementById("count").textContent = "The method, in order / " + LID.progress().done + " of " + D.lessons.length + " watched";
  }
  var fl = [{ key: "all", title: "All" }].concat(D.method);
  document.getElementById("filters").innerHTML = fl.map(function (m) { return '<button class="pill" type="button" data-k="' + m.key + '" aria-pressed="' + (m.key === f) + '">' + m.title + '</button>'; }).join("");
  document.getElementById("filters").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; f = b.dataset.k; document.querySelectorAll("#filters .pill").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.k === f); }); render(); });
  document.getElementById("search").addEventListener("input", function (e) { q = e.target.value.trim().toLowerCase(); render(); });
  render();
});
</script>
</main>
<footer id="foot"></footer>
<div id="toast" class="toast" role="status"></div>
<script src="/portal/portal.js"></script>
</body>
</html>
