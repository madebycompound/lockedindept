<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Home / Locked In Dept.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/portal/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/portal/config.js"></script>
<script src="/portal/data.js"></script>
</head>
<body data-page="home">
<div id="chrome"></div>
<main class="page">
<section class="head gut" style="border-bottom:0;padding-bottom:36px">
<div><p class="lbl" style="margin-bottom:12px" id="stageline">Club Locked In</p><h1 class="big" id="greet">Morning.</h1></div>
<span class="lbl" id="cohort"></span>
</section>

<a id="continue" href="/portal/library" class="rule" style="text-decoration:none;display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)">
<div class="fig" style="flex:1 1 320px;min-height:360px"><img src="/img/red-blur.jpg" alt="" style="object-position:center 30%"></div>
<div style="flex:2 1 420px;min-width:0;padding:28px var(--gr) 32px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:40px">
<div class="meta lbl"><span>Continue</span><span id="lessoncount"></span></div>
<div><p class="lbl" style="margin-bottom:12px" id="nextmod"></p><h2 class="big" id="nexttitle" style="font-size:clamp(36px,5vw,80px)"></h2></div>
<div style="display:flex;flex-direction:column;gap:12px"><div class="prog" role="img" aria-label="Progress"><i id="progbar" style="width:0"></i></div><span class="lbl" style="display:flex;justify-content:space-between;font-weight:700"><span>Resume lesson →</span><span id="pct" style="font-weight:500"></span></span></div>
</div>
</a>

<section class="split" id="rows">
<a href="/portal/check-in" class="cell cellR row" style="flex:1 1 300px"><span class="lbl">Today</span><span class="rowtitle" id="rittitle"></span><span class="link" id="cflink">Check in →</span></a>
<a href="/portal/calls" class="cell cellR row" style="flex:1 1 300px"><span class="lbl">Next call</span><span class="rowtitle" id="calltitle"></span><span class="link" id="callsub"></span></a>
<a href="/portal/assistant" class="cell row" style="flex:1 1 300px"><span class="lbl">Ask the Dept.</span><span class="rowtitle">Stuck on a quote, a client, a next step?</span><span class="link">Ask →</span></a>
</section>
<style>
.row{text-decoration:none;gap:28px;justify-content:space-between;min-height:220px;transition:background .25s}
.row:hover{background:#E2E0DB}
.rowtitle{font-size:24px;font-weight:800;letter-spacing:-.03em;text-transform:uppercase;line-height:1}
.row .link{min-height:auto}
</style>
<script>
document.addEventListener("lid:ready", function () {
  var D = LID.data, S = LID.state;
  document.getElementById("greet").textContent = LID.greeting();
  document.getElementById("cohort").textContent = D.cohort.name + " / Starts " + D.cohort.starts;
  var st = LID.stage(); if (st) document.getElementById("stageline").textContent = "Stage " + st.n + " / " + st.title;
  var nl = LID.nextLesson(), pr = LID.progress();
  document.getElementById("continue").href = "/portal/lesson?n=" + nl.n;
  document.getElementById("lessoncount").textContent = "Lesson " + nl.n + " / " + pr.total;
  var mod = D.method.find(function (m) { return m.key === nl.module; });
  document.getElementById("nextmod").textContent = (mod ? mod.n + " / " + mod.title : "");
  document.getElementById("nexttitle").textContent = nl.title;
  document.getElementById("progbar").style.width = pr.pct + "%";
  document.getElementById("pct").textContent = pr.pct + "%";

  var rit = S.rituals || ["Walk", "Train", "Meditate", "Sleep 7+ hours", "No phone first hour"];
  var tk = new Date().toISOString().slice(0, 10), done = (S.days || {})[tk] || {};
  var n = rit.filter(function (r) { return done[r]; }).length;
  document.getElementById("rittitle").textContent = n + " of " + rit.length + " rituals done";
  var dow = new Date().getDay(); var wk = (function (d) { var x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.toISOString().slice(0, 10); })(new Date());
  var has = (S.weeks || []).some(function (w) { return w.week === wk; });
  document.getElementById("cflink").textContent = (dow === 0 || dow >= 5) && !has ? "Weekly check-in due →" : "Check in →";

  var g = (D.calls || [])[0];
  if (S.next11) { document.getElementById("calltitle").textContent = "1:1 with Josh"; document.getElementById("callsub").textContent = LID.fmtDate(S.next11) + " →"; }
  else if (g) { document.getElementById("calltitle").textContent = g.title; document.getElementById("callsub").textContent = (g.date ? LID.fmtDate(g.date) : "Date to be confirmed") + " →"; }
  else { document.getElementById("calltitle").textContent = "Nothing booked"; document.getElementById("callsub").textContent = "Book a 1:1 →"; }
});
</script>
</main>
<footer id="foot"></footer>
<div id="toast" class="toast" role="status"></div>
<script src="/portal/portal.js"></script>
</body>
</html>
