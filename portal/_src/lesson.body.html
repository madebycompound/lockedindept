<section class="gut" style="padding-block:24px 0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px"><a class="link" href="/portal/library">← Library</a><span class="lbl" id="crumb"></span></section>
<section class="gut" style="padding-block:24px 32px;border-bottom:1px solid var(--line)">
<p class="lbl" style="margin-bottom:12px" id="mod"></p>
<h1 class="big" id="title" style="font-size:clamp(36px,6vw,92px)"></h1>
</section>
<section class="split">
<div class="cellR" style="flex:2 1 600px;min-width:0;border-bottom:1px solid var(--line)">
<div id="player" style="position:relative;aspect-ratio:16/9;background:var(--ink);color:var(--paper);display:flex;align-items:flex-end;padding:24px"></div>
</div>
<div class="cell" style="flex:1 1 320px;justify-content:space-between">
<div style="display:flex;flex-direction:column;gap:24px"><span class="lbl" id="mins"></span><p id="summary" style="font-size:17px;line-height:1.5"></p></div>
<div style="display:flex;flex-direction:column;gap:12px">
<button class="btn" id="done" type="button" style="justify-content:space-between">Mark as watched <svg aria-hidden="true" width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M0 6h20M15 1l5 5-5 5"></path></svg></button>
<a class="link" id="next" href="/portal/library">Next lesson →</a>
<a class="link" href="/portal/assistant" id="askabout">Ask the assistant about this →</a>
</div>
</div>
</section>
<script>
document.addEventListener("lid:ready", async function () {
  var D = LID.data, n = new URLSearchParams(location.search).get("n") || "01";
  var i = D.lessons.findIndex(function (l) { return l.n === n; }); if (i < 0) i = 0;
  var l = D.lessons[i], m = D.method.find(function (x) { return x.key === l.module; });
  document.title = l.title + " / Locked In Dept.";
  document.getElementById("crumb").textContent = "Lesson " + l.n + " / " + D.lessons.length;
  document.getElementById("mod").textContent = m ? m.n + " / " + m.title : "";
  document.getElementById("title").textContent = l.title;
  document.getElementById("mins").textContent = l.mins + " min";
  document.getElementById("summary").textContent = l.summary;
  document.getElementById("askabout").href = "/portal/assistant?q=" + encodeURIComponent("Help me apply lesson " + l.n + ", " + l.title + ", to my business.");
  var nx = D.lessons[i + 1]; document.getElementById("next").href = nx ? "/portal/lesson?n=" + nx.n : "/portal/library"; if (!nx) document.getElementById("next").textContent = "Back to library →";
  var p = document.getElementById("player");
  if (l.video) {
    var src = l.video.indexOf("vimeo.com") >= 0 && l.video.indexOf("player.vimeo.com") < 0 ? "https://player.vimeo.com/video/" + l.video.split("/").pop() : l.video;
    p.style.padding = 0; p.innerHTML = '<iframe src="' + src + '" title="' + l.title + '" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>';
  } else { p.innerHTML = '<span class="lbl">Video coming soon / Recorded before the cohort starts</span>'; }
  var b = document.getElementById("done"), done = LID.state.done || {};
  function paint() { b.firstChild.textContent = done[l.n] ? "Watched " : "Mark as watched "; }
  paint();
  b.addEventListener("click", async function () { done[l.n] = !done[l.n]; await LID.set({ done: done }); paint(); LID.toast(done[l.n] ? "Marked as watched" : "Marked as unwatched"); });
});
</script>
