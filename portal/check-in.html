<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Check-in / Locked In Dept.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/portal/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/portal/config.js"></script>
<script src="/portal/data.js"></script>
</head>
<body data-page="check-in">
<div id="chrome"></div>
<main class="page">
<section class="head gut" style="padding-bottom:0;border-bottom:0;align-items:flex-end">
<div><p class="lbl" style="margin-bottom:12px" id="weeklbl"></p><h1 class="big">Check-in</h1></div>
<nav aria-label="Check-in views" id="tabs" style="display:flex;gap:28px">
<a href="#today" class="link" data-t="today">Today</a>
<a href="#week" class="link" data-t="week">This week</a>
<a href="#history" class="link" data-t="history">History</a>
</nav>
</section>
<div class="rule"></div>

<!-- TODAY -->
<section id="v-today" class="gut" style="padding-block:40px 64px;max-width:720px">
<div class="meta lbl" style="margin-bottom:20px"><span id="today"></span><span id="todayscore"></span></div>
<div id="rituals" style="display:flex;flex-direction:column;gap:10px"></div>
<button type="button" id="logday" class="btn" style="width:100%;justify-content:space-between;min-height:60px;margin-top:16px">Log today <svg aria-hidden="true" width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M0 6h20M15 1l5 5-5 5"></path></svg></button>
<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:28px">
<div id="dots" style="display:flex;gap:6px" aria-label="Last seven days"></div>
<a href="#" id="editrituals" class="link" style="min-height:auto">Edit rituals →</a>
</div>
<form id="ritualform" hidden style="margin-top:24px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px">
<label for="ritualtext" class="lbl">One ritual per line, up to six</label>
<textarea id="ritualtext" class="input" rows="6"></textarea>
<div style="display:flex;gap:12px"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="cancelrituals">Cancel</button></div>
</form>
</section>

<!-- THIS WEEK -->
<form id="v-week" class="gut" hidden style="padding-block:40px 64px;max-width:720px;display:flex;flex-direction:column;gap:48px">
<p class="lbl" id="weekstatus"></p>
<div id="lastgoals" hidden>
<p class="lbl" style="margin-bottom:6px">Last week you said</p>
<div id="lastgoalslist" style="display:flex;flex-direction:column"></div>
</div>
<div id="joshnote" hidden style="background:var(--ink);color:var(--paper);padding:24px"><p class="lbl" style="margin-bottom:10px" id="joshwhen">From Josh</p><p id="joshtext" style="font-size:19px;line-height:1.4;font-weight:500;white-space:pre-line"></p></div>
<div>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px"><span class="big" style="font-size:34px">The numbers</span><span class="lbl">This week, honest</span></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 32px">
<div style="padding:14px 0;border-top:1px solid var(--line)"><label for="r-income" class="lbl" style="display:block;margin-bottom:4px">Earned (£)</label><input id="r-income" class="input" type="number" inputmode="numeric" min="0" placeholder="0" style="height:44px;border:0;font-size:28px;font-weight:800;letter-spacing:-.03em"></div>
<div style="padding:14px 0;border-top:1px solid var(--line)"><label for="r-hours" class="lbl" style="display:block;margin-bottom:4px">Hours worked</label><input id="r-hours" class="input" type="number" inputmode="numeric" min="0" max="120" placeholder="0" style="height:44px;border:0;font-size:28px;font-weight:800;letter-spacing:-.03em"></div>
<div style="padding:14px 0;border-top:1px solid var(--line)"><label for="r-quotes" class="lbl" style="display:block;margin-bottom:4px">Quotes sent</label><input id="r-quotes" class="input" type="number" inputmode="numeric" min="0" placeholder="0" style="height:44px;border:0;font-size:28px;font-weight:800;letter-spacing:-.03em"></div>
<div style="padding:14px 0;border-top:1px solid var(--line)"><label for="r-top" class="lbl" style="display:block;margin-bottom:4px">Highest price said out loud (£)</label><input id="r-top" class="input" type="number" inputmode="numeric" min="0" placeholder="0" style="height:44px;border:0;font-size:28px;font-weight:800;letter-spacing:-.03em"></div>
<div style="padding:14px 0;border-top:1px solid var(--line)"><label for="r-nos" class="lbl" style="display:block;margin-bottom:4px">Times you said no</label><input id="r-nos" class="input" type="number" inputmode="numeric" min="0" placeholder="0" style="height:44px;border:0;font-size:28px;font-weight:800;letter-spacing:-.03em"></div>
<div style="padding:14px 0;border-top:1px solid var(--line)"><label for="r-outreach" class="lbl" style="display:block;margin-bottom:4px">People you reached out to</label><input id="r-outreach" class="input" type="number" inputmode="numeric" min="0" placeholder="0" style="height:44px;border:0;font-size:28px;font-weight:800;letter-spacing:-.03em"></div>
</div>
<p class="note" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px">Earned and hours move your number on the home page. The rest are the reps that build belief.</p>
</div>
<div><label for="wins" class="big" style="display:block;font-size:34px;margin-bottom:12px">Wins</label><textarea id="wins" class="input" rows="2" placeholder="What moved this week"></textarea></div>
<div><label for="insights" class="big" style="display:block;font-size:34px;margin-bottom:12px">Insights</label><textarea id="insights" class="input" rows="2" placeholder="What you noticed"></textarea></div>
<div><label for="honesty" class="big" style="display:block;font-size:34px;margin-bottom:12px">Honesty</label><textarea id="honesty" class="input" rows="2" placeholder="Where could you have done better"></textarea></div>
<div>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px"><span class="big" style="font-size:34px">Core Four</span><span class="lbl" id="cftotal"></span></div>
<div id="cf" style="display:flex;flex-direction:column"></div>
</div>
<div>
<label class="big" style="display:block;font-size:34px;margin-bottom:12px">Next week</label>
<div style="display:flex;flex-direction:column;gap:6px">
<input id="g1" class="input" type="text" placeholder="Goal one">
<input id="g2" class="input" type="text" placeholder="Goal two">
<input id="g3" class="input" type="text" placeholder="Goal three">
</div>
</div>
<button class="btn" type="submit" style="justify-content:space-between;min-height:60px">Save check-in <svg aria-hidden="true" width="22" height="12" viewBox="0 0 22 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M0 6h20M15 1l5 5-5 5"></path></svg></button>
</form>

<!-- HISTORY -->
<section id="v-history" class="gut" hidden style="padding-block:40px 64px;max-width:720px"></section>

<script>
document.addEventListener("lid:ready", function () {
  var D = LID.data, S = LID.state;
  var DEFAULT = ["Walk", "Train", "Meditate", "Sleep 7+ hours", "No phone first hour"];
  S.rituals = S.rituals || DEFAULT.slice(); S.days = S.days || {}; S.weeks = S.weeks || [];
  function key(d) { return d.toISOString().slice(0, 10); }
  function weekKey(d) { var x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return key(x); }
  var today = new Date(), tk = key(today), wk = weekKey(today);
  document.getElementById("today").textContent = today.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("weeklbl").textContent = "Week of " + new Date(wk).toLocaleDateString("en-GB", { day: "numeric", month: "long" });

  // tabs
  var views = { today: "v-today", week: "v-week", history: "v-history" };
  function show(t) { if (!views[t]) t = "today"; Object.keys(views).forEach(function (k) { document.getElementById(views[k]).hidden = k !== t; }); document.querySelectorAll("#tabs a").forEach(function (a) { a.style.boxShadow = a.dataset.t === t ? "inset 0 -2px 0 var(--ink)" : "none"; }); }
  window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
  var dow = today.getDay(), hasWeek = S.weeks.some(function (w) { return w.week === wk; });
  show(location.hash.slice(1) || ((dow === 0 || dow >= 5) && !hasWeek ? "week" : "today"));

  // today
  function streak(r) { var n = 0; for (var i = 0; i < 400; i++) { var d = new Date(today); d.setDate(d.getDate() - i); var on = (S.days[key(d)] || {})[r]; if (on) n++; else if (i > 0) break; } return n; }
  function paintToday() {
    var done = S.days[tk] || {};
    document.getElementById("rituals").innerHTML = S.rituals.map(function (r) {
      var on = !!done[r], st = streak(r);
      return '<button type="button" data-r="' + r.replace(/"/g, "&quot;") + '" aria-pressed="' + on + '" style="display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:64px;padding:0 20px;border:1px solid var(--line);background:' + (on ? 'var(--yellow)' : 'transparent') + ';border-color:' + (on ? 'var(--yellow)' : 'var(--line)') + ';color:var(--ink);font:inherit;font-size:19px;font-weight:700;letter-spacing:-.01em;text-align:left;cursor:pointer;transition:background .15s"><span>' + r + '</span><span class="lbl" style="font-weight:500;opacity:.8">' + (st ? st + (st === 1 ? ' day' : ' days') : '') + '</span></button>';
    }).join("");
    var n = S.rituals.filter(function (r) { return done[r]; }).length;
    document.getElementById("todayscore").textContent = n + " of " + S.rituals.length;
    var dots = ""; for (var i = 6; i >= 0; i--) { var d = new Date(today); d.setDate(d.getDate() - i); var dd = S.days[key(d)] || {}; var c = S.rituals.filter(function (r) { return dd[r]; }).length; var full = c === S.rituals.length && c > 0; dots += '<span title="' + key(d) + '" style="width:28px;height:28px;border:1px solid ' + (full ? 'var(--yellow)' : 'var(--line)') + ';background:' + (full ? 'var(--yellow)' : c ? 'var(--ghost)' : 'transparent') + '"></span>'; }
    document.getElementById("dots").innerHTML = dots;
  }
  document.getElementById("rituals").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; var r = b.dataset.r; S.days[tk] = S.days[tk] || {}; S.days[tk][r] = !S.days[tk][r]; paintToday(); });
  document.getElementById("logday").addEventListener("click", async function () { var b = this; b.disabled = true; var ok = await LID.set({ days: S.days }); b.disabled = false; if (ok) { var n = S.rituals.filter(function (r) { return (S.days[tk] || {})[r]; }).length; LID.toast("Logged. " + n + " of " + S.rituals.length + " today"); } });
  var rf = document.getElementById("ritualform");
  document.getElementById("editrituals").addEventListener("click", function (e) { e.preventDefault(); document.getElementById("ritualtext").value = S.rituals.join("\n"); rf.hidden = false; });
  document.getElementById("cancelrituals").addEventListener("click", function () { rf.hidden = true; });
  rf.addEventListener("submit", async function (e) { e.preventDefault(); var list = document.getElementById("ritualtext").value.split("\n").map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 6); if (!list.length) return; S.rituals = list; await LID.set({ rituals: list }); rf.hidden = true; paintToday(); LID.toast("Rituals saved"); });

  // week
  var thisWeek = S.weeks.find(function (w) { return w.week === wk; });
  var prev = S.weeks.filter(function (w) { return w.week < wk; }).sort(function (a, b) { return a.week < b.week ? 1 : -1; })[0];
  document.getElementById("weekstatus").textContent = thisWeek ? "Saved. Edit any time this week." : "Takes about ten minutes. Sunday is the habit, any day works.";
  var lastCF = (S.coreFour || []).slice(-1)[0];
  document.getElementById("cf").innerHTML = D.coreFour.map(function (c, i) { var v = thisWeek ? thisWeek.scores[c.key] : (lastCF ? lastCF.scores[c.key] : 5); return '<div style="display:flex;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)' + (i === D.coreFour.length - 1 ? ';border-bottom:1px solid var(--line)' : '') + '"><span style="flex:1;font-size:19px;font-weight:700">' + c.title + '</span><button type="button" class="step" data-k="' + c.key + '" data-d="-1" aria-label="Lower ' + c.title + '" style="width:44px;height:44px;border:1px solid var(--line);background:transparent;font:inherit;font-size:22px;cursor:pointer">−</button><output id="cf-' + c.key + '" class="big" style="font-size:34px;min-width:2ch;text-align:center" data-v="' + v + '">' + v + '</output><button type="button" class="step" data-k="' + c.key + '" data-d="1" aria-label="Raise ' + c.title + '" style="width:44px;height:44px;border:1px solid var(--line);background:transparent;font:inherit;font-size:22px;cursor:pointer">+</button></div>'; }).join("");
  function cfv(k) { return +document.getElementById("cf-" + k).dataset.v; }
  function cft() { var t = 0; D.coreFour.forEach(function (c) { t += cfv(c.key); }); document.getElementById("cftotal").textContent = t + " / 40"; }
  document.getElementById("cf").addEventListener("click", function (e) { var b = e.target.closest(".step"); if (!b) return; var o = document.getElementById("cf-" + b.dataset.k); var v = Math.min(10, Math.max(1, cfv(b.dataset.k) + +b.dataset.d)); o.dataset.v = v; o.textContent = v; cft(); });
  cft();
  var REPS = ["income", "hours", "quotes", "top", "nos", "outreach"];
  if (thisWeek && thisWeek.reps) REPS.forEach(function (k) { document.getElementById("r-" + k).value = thisWeek.reps[k] == null ? "" : thisWeek.reps[k]; });
  var jn = (LID.notes || []).find(function (n) { return n.week === wk; }) || (LID.notes || [])[0];
  if (jn) { document.getElementById("joshnote").hidden = false; document.getElementById("joshtext").textContent = jn.note; document.getElementById("joshwhen").textContent = "From Josh / " + new Date(jn.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" }); }
  if (thisWeek) { ["wins", "insights", "honesty"].forEach(function (k) { document.getElementById(k).value = thisWeek[k] || ""; }); (thisWeek.goals || []).forEach(function (g, i) { document.getElementById("g" + (i + 1)).value = g.text || ""; }); }
  if (prev && (prev.goals || []).length) {
    document.getElementById("lastgoals").hidden = false;
    document.getElementById("lastgoalslist").innerHTML = prev.goals.map(function (g, i) { return '<label style="display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:17px;cursor:pointer"><input type="checkbox" data-i="' + i + '" ' + (g.hit ? 'checked' : '') + ' style="width:22px;height:22px;accent-color:#0B0B0B;margin:0"><span style="flex:1;' + (g.hit ? 'color:var(--mute);text-decoration:line-through' : '') + '">' + g.text + '</span></label>'; }).join("");
    document.getElementById("lastgoalslist").addEventListener("change", async function (e) { var i = +e.target.dataset.i; prev.goals[i].hit = e.target.checked; await LID.set({ weeks: S.weeks }); });
  }
  document.getElementById("v-week").addEventListener("submit", async function (e) {
    e.preventDefault();
    var scores = {}; D.coreFour.forEach(function (c) { scores[c.key] = cfv(c.key); });
    var entry = thisWeek || { week: wk }; entry.at = new Date().toISOString();
    entry.wins = document.getElementById("wins").value.trim(); entry.insights = document.getElementById("insights").value.trim(); entry.honesty = document.getElementById("honesty").value.trim();
    entry.reps = {}; REPS.forEach(function (k) { var v = document.getElementById("r-" + k).value; entry.reps[k] = v === "" ? null : +v; });
    entry.scores = scores; entry.goals = [1, 2, 3].map(function (i) { return document.getElementById("g" + i).value.trim(); }).filter(Boolean).map(function (t, i) { return { text: t, hit: (thisWeek && thisWeek.goals && thisWeek.goals[i] && thisWeek.goals[i].text === t) ? thisWeek.goals[i].hit : false }; });
    if (!thisWeek) { S.weeks.push(entry); thisWeek = entry; }
    var cf = S.coreFour || []; var same = cf.find(function (x) { return x.at && x.at.slice(0, 10) === tk; }); if (same) same.scores = scores; else cf.push({ at: entry.at, scores: scores });
    await LID.set({ weeks: S.weeks, coreFour: cf }); LID.toast("Saved"); document.getElementById("weekstatus").textContent = "Saved. Edit any time this week."; paintHistory();
  });

  // history
  function paintHistory() {
    var h = document.getElementById("v-history"); var ws = S.weeks.slice().sort(function (a, b) { return a.week < b.week ? 1 : -1; });
    if (!ws.length) { h.innerHTML = '<p style="font-size:17px;line-height:1.5;max-width:460px">Nothing yet. Your first weekly check-in becomes the baseline we measure the 90 days against.</p>'; return; }
    h.innerHTML = ws.map(function (w) {
      var tot = 0; Object.keys(w.scores || {}).forEach(function (k) { tot += w.scores[k]; }); var gs = w.goals || [], hit = gs.filter(function (g) { return g.hit; }).length;
      return '<details style="border-bottom:1px solid var(--line)"><summary style="display:flex;flex-wrap:wrap;gap:8px 24px;padding-block:20px;cursor:pointer;list-style:none;align-items:baseline"><span style="flex:1;font-size:19px;font-weight:700">Week of ' + new Date(w.week).toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + '</span>' + (w.reps && w.reps.hours ? '<span class="lbl">' + LID.gbp((w.reps.income || 0) / w.reps.hours) + '/hr</span>' : '') + (w.reps ? '<span class="lbl">' + (w.reps.quotes || 0) + ' quotes</span>' : '') + '<span class="lbl">Core Four ' + tot + '</span>' + (gs.length ? '<span class="lbl">' + hit + '/' + gs.length + ' goals</span>' : '') + '</summary><div style="padding:0 0 24px;display:flex;flex-direction:column;gap:14px;font-size:16px;line-height:1.5">' + [["Wins", w.wins], ["Insights", w.insights], ["Honesty", w.honesty]].filter(function (p) { return p[1]; }).map(function (p) { return '<div><span class="lbl">' + p[0] + '</span><br>' + p[1].replace(/</g, "&lt;") + '</div>'; }).join("") + (gs.length ? '<div><span class="lbl">Goals</span><br>' + gs.map(function (g) { return (g.hit ? "✓ " : "· ") + g.text.replace(/</g, "&lt;"); }).join("<br>") + '</div>' : '') + '</div></details>';
    }).join("");
  }
  paintToday(); paintHistory();
});
</script>
</main>
<footer id="foot"></footer>
<div id="toast" class="toast" role="status"></div>
<script src="/portal/portal.js"></script>
</body>
</html>
