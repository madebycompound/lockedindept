<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agents / Locked In Dept.</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/portal/portal.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/portal/config.js"></script>
<script src="/portal/data.js"></script>
</head>
<body data-page="agents">
<div id="chrome"></div>
<main class="page">
<section class="head gut">
<div><p class="lbl" style="margin-bottom:12px">04 / Systems / Install into your own Claude setup</p><h1 class="big">Agent<br>library</h1></div>
<a class="link" href="/portal/assistant?q=Which%20agent%20should%20I%20set%20up%20first%3F">Not sure where to start? Ask the assistant →</a>
</section>
<div class="gut lbl" style="padding-block:14px;display:flex;flex-wrap:wrap;gap:8px 24px;border-bottom:1px solid var(--line)"><span style="flex:0 0 40px">No.</span><span style="flex:2 1 300px">Agent</span><span style="flex:1 1 160px">Works with</span><span style="flex:2 1 420px">Install</span></div>
<div id="list"></div>
<section class="gut" style="padding-block:40px 56px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px">
<div><p class="lbl" style="margin-bottom:12px">Not listed?</p><p class="big" style="font-size:clamp(28px,3vw,44px)">Tell us the job<br>eating your week.</p></div>
<a class="btn" id="request" href="#">Request an agent</a>
</section>
<script>
document.addEventListener("lid:ready", function () {
  var D = LID.data, C = LID.config, inst = LID.state.installed || {};
  document.getElementById("list").innerHTML = D.agents.map(function (a) {
    var ready = !!a.download;
    return '<div class="gut" style="padding-block:24px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:16px 24px;border-bottom:1px solid var(--line)">' +
      '<span class="lbl" style="flex:0 0 40px;padding-top:6px">' + a.n + '</span>' +
      '<div style="flex:2 1 300px;min-width:0"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px"><h2 class="big" style="font-size:28px">' + a.name + '</h2>' + (inst[a.slug] ? '<span class="badge soft">Installed</span>' : ready ? '' : '<span class="badge soft">Coming soon</span>') + '</div><p style="font-size:15px;line-height:1.5;max-width:420px;margin-bottom:8px">' + a.desc + '</p><span class="lbl" style="color:var(--mute)">Code: ' + a.code + '</span></div>' +
      '<span style="flex:1 1 160px;font-size:15px;line-height:1.45;padding-top:4px">' + a.needs + '</span>' +
      '<div style="flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:12px">' +
      '<div style="display:flex;background:var(--ink)"><code style="flex:1 1 auto;min-width:0;overflow-x:auto;white-space:nowrap;padding:15px 16px;font-family:SF Mono,Menlo,Consolas,monospace;font-size:13px;color:var(--paper)">$ claude plugin install ' + a.slug + '@lockedin-dept</code><button type="button" class="copy" data-c="claude plugin marketplace add madebycompound/lockedindept && claude plugin install ' + a.slug + '@lockedin-dept" style="min-height:44px;padding:0 18px;border:0;border-left:1px solid #3A3A3A;background:var(--ink);color:var(--paper);font:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer">Copy</button></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px 24px">' + (ready ? '<a class="link" href="' + a.download + '" target="_blank" rel="noopener">View the agent →</a>' : '<span class="link" style="color:var(--mute)">Download coming soon</span>') + (a.guide ? '<a class="link" href="' + a.guide + '" target="_blank" rel="noopener">Setup guide →</a>' : '') + '<button type="button" class="link mark" data-s="' + a.slug + '" style="background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase">' + (inst[a.slug] ? 'Mark not installed' : 'Mark installed') + ' →</button></div></div></div>';
  }).join("");
  document.getElementById("list").addEventListener("click", async function (e) {
    var c = e.target.closest(".copy"); if (c) { try { await navigator.clipboard.writeText(c.dataset.c); c.textContent = "Copied"; setTimeout(function () { c.textContent = "Copy"; }, 1500); } catch (err) { LID.toast("Select and copy the command"); } return; }
    var m = e.target.closest(".mark"); if (m) { inst[m.dataset.s] = !inst[m.dataset.s]; await LID.set({ installed: inst }); location.reload(); }
  });
  var r = document.getElementById("request"); r.href = "mailto:" + C.SUPPORT_EMAIL + "?subject=Agent%20request";
});
</script>
</main>
<footer id="foot"></footer>
<div id="toast" class="toast" role="status"></div>
<script src="/portal/portal.js"></script>
</body>
</html>
